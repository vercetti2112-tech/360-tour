<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--HEAD-->
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="/vendor/three/three.module.min.js" as="script" crossorigin>
<link rel="stylesheet" href="/vendor/psv/core/index.css">
<link rel="stylesheet" href="/vendor/psv/markers-plugin/index.css">
<link rel="stylesheet" href="/assets/viewer.css">
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/three.module.min.js",
  "@photo-sphere-viewer/core": "/vendor/psv/core/index.module.js",
  "@photo-sphere-viewer/markers-plugin": "/vendor/psv/markers-plugin/index.module.js",
  "@photo-sphere-viewer/autorotate-plugin": "/vendor/psv/autorotate-plugin/index.module.js",
  "@photo-sphere-viewer/gyroscope-plugin": "/vendor/psv/gyroscope-plugin/index.module.js",
  "@photo-sphere-viewer/stereo-plugin": "/vendor/psv/stereo-plugin/index.module.js",
  "@photo-sphere-viewer/equirectangular-tiles-adapter": "/vendor/psv/equirectangular-tiles-adapter/index.module.js"
} }
</script>
<!--BOOT-->
</head>
<body>
  <div id="pano" aria-label="Ảnh 360°"></div>

  <div id="loader" class="loader"><div class="loader-ring"></div><div class="loader-name"></div></div>

  <!-- Thanh điều hướng chính (dọc trái trên desktop, đáy trên mobile) -->
  <header class="brand"><a class="brand-mark" href="#" data-home></a></header>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <nav class="rail" id="rail" aria-label="Điều hướng chính"></nav>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- Tiêu đề cảnh hiện tại -->
  <div class="scene-title" id="sceneTitle"><span class="st-group"></span><span class="st-sep">›</span><span class="st-name"></span></div>

  <!-- Công cụ phải trên: ngôn ngữ + CTA -->
  <div class="topbar">
    <div class="weather" id="weather" hidden></div>
    <div class="lang" id="lang"></div>
    <button class="cta" id="ctaBtn" data-i18n="cta"></button>
  </div>

  <!-- La bàn dạng thước (kiểu dock) + thanh công cụ dọc phải + nút ẩn/hiện giao diện -->
  <div class="compass-tape" id="compassTape" hidden aria-hidden="true"><div class="tape-inner" id="tapeInner"></div><span class="tape-pin"></span></div>
  <div class="toolbar" id="toolbar" hidden></div>
  <button class="ui-toggle" id="uiToggle" hidden aria-label="Ẩn giao diện"></button>

  <!-- La bàn + công tắc ngày/đêm + mặt bằng căn -->
  <div class="compass" id="compass" hidden><div class="compass-dial"><span>N</span></div><div class="compass-cone"></div></div>
  <button class="daynight" id="dayNight" hidden aria-label="Ngày / đêm"><span class="dn-sun">☀</span><span class="dn-knob"></span><span class="dn-moon">☾</span></button>
  <div class="minimap" id="minimap" hidden><div class="mm-head"><span></span><button class="mm-close" aria-label="Thu gọn">–</button></div><div class="mm-body"></div></div>

  <!-- Thanh điều khiển -->
  <div class="controls" id="controls"></div>

  <!-- Mạng xã hội (chân trang trái) + nút riêng của nhóm căn hộ -->
  <div class="social" id="social"></div>
  <div class="unit-bar" id="unitBar" hidden></div>

  <!-- Liên hệ nhanh -->
  <div class="quick" id="quick"></div>

  <div class="disclaimer" id="disclaimer" hidden></div>

  <!-- Các trang con dạng lớp phủ (không tải lại thư viện) -->
  <section class="view" id="view" hidden><div class="view-head"><h1></h1><button class="x" data-close-view aria-label="Đóng">×</button></div><div class="view-body"></div></section>

  <!-- Modal dùng chung -->
  <div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><button class="x" data-close-modal aria-label="Đóng">×</button><div class="modal-body"></div></div></div>
  <div class="toast" id="toast" hidden></div>

  <!--SEO-->
  <noscript><p style="padding:20px;color:#fff">Vui lòng bật JavaScript để xem tour 360°.</p></noscript>
  <script type="module" src="/assets/viewer.js"></script>
</body>
</html>
